name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          # Run numbers only go up, so every build can be installed over the previous one.
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Tagged releases must be signed: set the SIGNING_* repository secrets."
            exit 1
          else
            echo "::warning::No signing key configured; this build is signed with a throwaway debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon --stacktrace assembleRelease
          -PappVersionName="${{ steps.version.outputs.name }}"
          -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk nts-tv.apk
          sha256sum nts-tv.apk | tee nts-tv.apk.sha256
          ls -l nts-tv.apk

      - uses: actions/upload-artifact@v7
        with:
          name: nts-tv-apk
          path: |
            nts-tv.apk
            nts-tv.apk.sha256
          if-no-files-found: error

  smoke-test:
    name: Smoke test on Android TV emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nts-tv-apk

      - name: Check the NTS API is up
        run: |
          mkdir -p smoke-output
          curl -fsS https://www.nts.live/api/v2/live -o smoke-output/live.json
          curl -fsS https://www.nts.live/api/v2/mixtapes -o smoke-output/mixtapes.json
          jq -c '.results[] | {channel_name, title: .now.broadcast_title, location: .now.embeds.details.location_long, start: .now.start_timestamp, end: .now.end_timestamp, media: (.now.embeds.details.media | keys? // [])}' smoke-output/live.json
          jq -c '.results[] | {mixtape_alias, title, subtitle, audio_stream_endpoint, media: (.media | keys? // [])}' smoke-output/mixtapes.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and tune in
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke-test.sh nts-tv.apk smoke-output

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-output
          path: smoke-output/

      # Also keep the latest main-branch results on a branch, so screenshots can be
      # browsed (or fetched with git) without downloading artifacts.
      - name: Publish results to the smoke-test-results branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd smoke-output
          git init -q -b smoke-test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Smoke test output for ${GITHUB_SHA::7} (run $GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:smoke-test-results

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nts-tv-apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes.md
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 nts-tv.apk.sha256)\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" nts-tv.apk nts-tv.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "NTS Radio for Google TV $GITHUB_REF_NAME" \
            --notes-file notes.md
