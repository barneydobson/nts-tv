name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only superseded pull-request runs are cancelled; a push to main never cancels a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # SHA-256 of the release signing certificate. Update this if the key is ever rotated.
  EXPECTED_SIGNER_SHA256: b2935341ac25ad94c218f4bfcaefd1b9a12a62e7c07d3fcb0ff63907f1000021

# Third-party code is pinned to full commit SHAs (Dependabot keeps them current).
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.name }}
      sha256: ${{ steps.collect.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # A release happens when a v* tag is pushed, or when main is pushed with a
      # version.txt that hasn't been released yet (the release job then creates the tag).
      - name: Work out version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(tr -d '[:space:]' < version.txt)
          if [[ "$REF" == refs/tags/v* ]]; then
            name="${REF_NAME#v}"; release=true; tag="$REF_NAME"
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main ]] &&
               [ -z "$(git ls-remote --tags origin "refs/tags/v$base")" ]; then
            name="$base"; release=true; tag="v$base"
          else
            name="$base-dev.$RUN_NUMBER"; release=false; tag=""
          fi
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Refusing to build: invalid version '$name'"
            exit 1
          fi
          echo "Version $name (release: $release)"
          {
            echo "name=$name"
            echo "release=$release"
            echo "tag=$tag"
            # Run numbers only go up, so every build can be installed over the previous one.
            echo "code=$((100 + RUN_NUMBER))"
          } >> "$GITHUB_OUTPUT"

      # The release key is only ever decoded for release builds. Everything else
      # (pull requests, dev builds) is signed with a throwaway debug key.
      - name: Set up release signing key
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Releases must be signed: set the SIGNING_KEYSTORE_BASE64 and SIGNING_STORE_PASSWORD secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_STORE_PASSWORD: ${{ steps.version.outputs.release == 'true' && secrets.SIGNING_STORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ steps.version.outputs.release == 'true' && secrets.SIGNING_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ steps.version.outputs.release == 'true' && secrets.SIGNING_KEY_PASSWORD || '' }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the signing certificate
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under the Android SDK"
            exit 1
          fi
          echo "Using $apksigner"
          if ! "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > signer.txt 2>&1; then
            echo "::error::apksigner verify failed: $(head -c 600 signer.txt | tr '\n' ' ')"
            exit 1
          fi
          cat signer.txt
          # Every signer listed (v2 and v3 blocks) must be the pinned release certificate.
          digests=$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' signer.txt | awk '{print $NF}' | sort -u)
          if [ -z "$digests" ]; then
            echo "::error::apksigner printed no certificate digest"
            exit 1
          fi
          if [ "$digests" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::APK is signed with an unexpected certificate: $(echo $digests)"
            exit 1
          fi
          echo "::notice title=Signing::Signed with the expected release certificate"

      - name: Collect APK
        id: collect
        run: |
          cp app/build/outputs/apk/release/app-release.apk nts-tv.apk
          sha256sum nts-tv.apk | tee nts-tv.apk.sha256
          echo "sha256=$(cut -d' ' -f1 nts-tv.apk.sha256)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nts-tv-apk
          path: |
            nts-tv.apk
            nts-tv.apk.sha256
          if-no-files-found: error

  smoke-test:
    name: Smoke test on Android TV emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nts-tv-apk

      - name: Check the APK is the one that was built
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: echo "$EXPECTED  nts-tv.apk" | sha256sum -c -

      - name: Check the NTS API is up
        run: |
          mkdir -p smoke-output
          curl -fsS https://www.nts.live/api/v2/live -o smoke-output/live.json
          curl -fsS https://www.nts.live/api/v2/mixtapes -o smoke-output/mixtapes.json
          jq -c '.results[] | {channel_name, title: .now.broadcast_title, location: .now.embeds.details.location_long}' smoke-output/live.json
          jq -c '.results[] | {mixtape_alias, title, audio_stream_endpoint}' smoke-output/mixtapes.json
          # How quickly the image CDN serves the artwork the app will ask for.
          art=$(jq -r '.results[0].now.embeds.details.media.picture_medium_large // empty' smoke-output/live.json)
          if [ -n "$art" ]; then
            curl -sS -o /dev/null --max-time 30 -w "::notice title=Artwork CDN::HTTP %{http_code} in %{time_total}s (http/%{http_version}) for $art\n" "$art" ||
              echo "::warning title=Artwork CDN::fetch failed for $art"
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and tune in
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke-test.sh nts-tv.apk smoke-output

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: smoke-test-output
          path: smoke-output/

  # Keeps the latest main-branch screenshots on a branch so they can be browsed without
  # downloading artifacts. Only this small job, with no third-party code, can write.
  publish-smoke-results:
    name: Publish smoke-test screenshots
    needs: smoke-test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.smoke-test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: smoke-test-output
          path: smoke-output

      - name: Push to the smoke-test-results branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          mkdir publish
          # Screenshots, media-session state and the app's own log only (no full system log).
          cp smoke-output/*.png smoke-output/media-session-*.txt publish/ 2>/dev/null || true
          cp smoke-output/app-log.txt publish/ 2>/dev/null || true
          cd publish
          git init -q -b smoke-test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Smoke test output for ${SHA::7} (run $RUN_ID)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:smoke-test-results

  release:
    name: Publish GitHub release
    if: needs.build.outputs.release == 'true'
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nts-tv-apk

      - name: Check the APK is the one that was built and tested
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: echo "$EXPECTED  nts-tv.apk" | sha256sum -c -

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          APK_SHA256: ${{ needs.build.outputs.sha256 }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          {
            cat .github/release-notes.md
            echo
            echo "APK SHA-256: \`$APK_SHA256\`"
            echo
            echo "Signing certificate SHA-256: \`$EXPECTED_SIGNER_SHA256\`"
          } > notes.md
          # --target creates the tag at this commit if it doesn't exist yet.
          gh release create "$TAG" nts-tv.apk nts-tv.apk.sha256 \
            --repo "$REPO" \
            --target "$SHA" \
            --title "NTS Radio for Google TV $TAG" \
            --notes-file notes.md

  # After publishing, check that the previous release really updates itself to this one.
  update-test:
    name: Self-update test (previous release → this one)
    needs: [build, release]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          prev=$(gh api "repos/$REPO/releases?per_page=30" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -vxF "$TAG" | sort -V | tail -n1)
          # The updater first shipped in 1.1.0; older releases can't update themselves.
          if [ -z "$prev" ] || ! printf '%s\n' "1.1.0" "${prev#v}" | sort -V -C; then
            echo "::notice title=Update test::Skipped: no earlier release with the updater (previous: ${prev:-none})"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$prev" --repo "$REPO" --pattern nts-tv.apk --output previous.apk
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        if: steps.previous.outputs.skip != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the previous release and let it update itself
        if: steps.previous.outputs.skip != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/update-test.sh previous.apk update-output

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.previous.outputs.skip != 'true'
        with:
          name: update-test-output
          path: update-output/

  publish-update-test-results:
    name: Publish update-test screenshots
    needs: update-test
    if: always() && needs.update-test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: update-test-output
          path: update-output

      - name: Push to the update-test-results branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          [ -d update-output ] || { echo "No update-test output (test was skipped)"; exit 0; }
          mkdir publish
          cp update-output/*.png publish/ 2>/dev/null || true
          grep -h "NtsTvUpdater\|PackageInstaller\|ntstv" update-output/logcat*.txt > publish/app-log.txt 2>/dev/null || true
          cd publish
          git init -q -b update-test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Update test output for ${SHA::7} (run $RUN_ID)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:update-test-results
